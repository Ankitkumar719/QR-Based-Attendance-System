name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          passphrase: ${{ secrets.EC2_SSH_PASSPHRASE }}
          timeout: 30s
          script: |
            echo "=== SSH connected ==="
            echo "User: $(whoami)"
            echo "Home: $HOME"
            pwd
            ls -la
            echo "=== Change to repo directory ==="
            cd ~/QR-Based-Attendance-System
            pwd
            ls -la
            echo "=== Deploy commands ==="
            git pull origin main
            npm install
            pm2 restart all
            pm2 save
