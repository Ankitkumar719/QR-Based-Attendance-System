services:
  # Single-service deployment (Node.js backend + Python ML/face components in the same container)
  - type: web
    name: smart-attendance-backend
    env: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://smart-attendance.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://smart-attendance.onrender.com,http://localhost:5500,http://127.0.0.1:5500
      - key: FACE_PYTHON_BIN
        value: python3
