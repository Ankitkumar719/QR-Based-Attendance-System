services:
  # Single-service deployment (Node.js backend + local Python worker)
  # Uses Docker so we can install the Python face-recognition dependencies inside the same service.
  - type: web
    name: smart-attendance-backend
    env: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://attendsmart.in
      - key: ALLOWED_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500,https://attendsmart.in
      # Python binary inside the container
      - key: FACE_PYTHON_BIN
        value: python3
